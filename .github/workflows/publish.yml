name: publish
# Publishing a GitHub release tagged vX.Y.Z uploads zeropoint X.Y.Z to PyPI.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag and package version must match
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/zeropoint/_version.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Build with pinned tools (hashes checked)
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m build --no-isolation
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
