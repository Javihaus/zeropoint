name: fuzz
# Fuzzing with Atheris: the decision rule with arbitrary numbers, and model loading with damaged files.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  atheris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned dependencies (hashes checked)
        run: |
          python -m pip install --require-hashes -r requirements/fuzz.txt
          python -m pip install --no-deps -e .
      - name: Fuzz the decision rule
        run: python fuzz/fuzz_engine.py -max_total_time=120
      - name: Fuzz model loading, starting from the shipped models
        run: |
          mkdir -p corpus && cp src/zeropoint/presets/*-small.safetensors corpus/
          python fuzz/fuzz_load.py corpus -max_total_time=120 -rss_limit_mb=4096
