name: tests
# Linux (x86 and ARM), macOS (ARM) and Windows on the two newest Python versions ZeroPoint supports, plus the oldest
# on Linux. Python 3.15 is not tested yet: onnxruntime has no build for it.
#
# Every job checks the 500 golden cases (same decisions, no probability moving more than 1e-5) and uploads a
# report saying whether the outputs were also identical to the last bit on that platform. Every job measures
# latency; the budget is enforced on Linux x86, the platform the published numbers come from.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies (hashes checked)
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps -e .
      - name: Run the tests
        env:
          ZP_GOLDEN_REPORT: golden-${{ matrix.os }}-${{ matrix.python }}.json
        run: python -m pytest -q
      - name: Measure latency
        shell: bash
        run: |
          check=""
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python }}" = "3.13" ]; then check="--check"; fi
          python benchmarks/latency.py $check --out latency-${{ matrix.os }}-${{ matrix.python }}.json
      - name: Keep the golden and latency reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            golden-*.json
            latency-*.json
          if-no-files-found: ignore

  fit:
    # fit() needs torch and onnx, which the decision engine never needs; tested once, on Linux.
    runs-on: ubuntu-latest
    name: fit / Python 3.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned dependencies (hashes checked)
        run: |
          python -m pip install --require-hashes -r requirements/ci-torch.txt
          python -m pip install --require-hashes --no-deps -r requirements/torch-cpu.txt
          python -m pip install --no-deps -e .
      - name: Run the fit tests
        run: python -m pytest -q tests/test_fit.py tests/test_recalibrate.py

  wheel:
    # The package as users get it: build the wheel with the pinned build tools, check it fits PyPI's 100 MB limit,
    # install it alone in a clean environment and decide with every network route blocked.
    runs-on: ubuntu-latest
    name: wheel / Python 3.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build with pinned tools (hashes checked)
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m build --no-isolation
      - name: The wheel must be under 100 MB
        run: |
          size=$(stat -c %s dist/*.whl)
          echo "wheel: $size bytes"
          test "$size" -lt 100000000
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --require-hashes -r requirements/ci.txt
          /tmp/clean/bin/python -m pip install --no-deps dist/*.whl
      - name: Decide without network
        working-directory: /tmp
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          /tmp/clean/bin/python -I -c "
          from zeropoint import ZeroPoint, __version__
          zp = ZeroPoint()
          d = zp.decide('Set an alarm for 6:30 tomorrow morning', ['transfer', 'balance', 'pay bill'])
          assert d.choice is None, d
          d = zp.decide('Can you move 200 euros from my savings to my checking account?', ['transfer', 'balance', 'pay bill'])
          assert d.choice == 'transfer', d
          print(__version__, 'ok')
          "
