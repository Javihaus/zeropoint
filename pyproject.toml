[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "zeropoint"
dynamic = ["version", "readme"]
description = "Chooses the option that fits a text, or answers that none of them does. Runs on a CPU, model included."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Javier Marín", email = "javier@jmarin.info" }]
requires-python = ">=3.10"
keywords = ["energy-based model", "decision engine", "out-of-scope detection", "abstention", "classification", "onnx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.22",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
# fit() trains on your labelled texts; deciding never needs these
fit = ["torch>=2.1", "onnx>=1.15"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Javihaus/zeropoint"
Documentation = "https://javihaus.github.io/zeropoint/"
Benchmark = "https://github.com/Javihaus/zeropoint/blob/main/BENCHMARK.md"
Changelog = "https://github.com/Javihaus/zeropoint/blob/main/CHANGELOG.md"
Issues = "https://github.com/Javihaus/zeropoint/issues"

# PyPI does not render LaTeX. Its description is the README without the steps of "How it works",
# which stay on GitHub; everything else is the README as it is.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
end-before = "#### 1. Reading the text and the options together"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = """
The step-by-step explanation, with the equations, is in the
[README on GitHub](https://github.com/Javihaus/zeropoint#how-it-works): reading the text and the options together,
the depth of each well, Boltzmann's rule with the ground at zero, and why the numbers are the same every time.

<br>

"""

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
start-at = "## What it was trained on"

[tool.hatch.version]
path = "src/zeropoint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zeropoint"]

[tool.hatch.build.targets.sdist]
include = ["src/zeropoint", "tests", "README.md", "BENCHMARK.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
