[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "zeropoint"
dynamic = ["version", "readme"]
description = "An energy-based decision engine that chooses among options, or says that none of them fits."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Javier Marín", email = "javier@jmarin.info" }]
requires-python = ">=3.10"
keywords = ["energy-based model", "decision engine", "out-of-scope detection", "abstention", "classification", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.22",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
]

[project.optional-dependencies]
train = ["torch>=2.1"]
monitor = ["torch>=2.1", "ndtracker>=2.0"]
dev = ["pytest>=7", "torch>=2.1"]

[project.urls]
Homepage = "https://github.com/Javihaus/zeropoint"
Documentation = "https://javihaus.github.io/zeropoint/"
Benchmark = "https://github.com/Javihaus/zeropoint/blob/main/BENCHMARK.md"
Issues = "https://github.com/Javihaus/zeropoint/issues"

# PyPI does not render LaTeX. Its description is the README without the equations of "Energy-based models",
# which stay on GitHub; everything else is the README as it is.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
end-before = "#### 1. The text"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = """
The step-by-step explanation, with the equations, is in the
[README on GitHub](https://github.com/Javihaus/zeropoint#energy-based-models): the text, the options, the vacuum,
Boltzmann's rule, and the edge of the data.

<br>

"""

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
start-at = "## Choosing the energy landscape"

[tool.hatch.version]
path = "src/zeropoint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zeropoint"]

[tool.hatch.build.targets.sdist]
include = ["src/zeropoint", "tests", "README.md", "BENCHMARK.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
