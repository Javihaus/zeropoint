[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zeropoint"
dynamic = ["version"]
readme = "README.md"
description = "Chooses the option that fits a text, or answers that none of them does. Runs on a CPU, model included."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Javier Marín", email = "javier@jmarin.info" }]
requires-python = ">=3.10"
keywords = ["energy-based model", "decision engine", "out-of-scope detection", "abstention", "classification", "onnx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.22",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
# fit() trains on your labelled texts; deciding never needs these
fit = ["torch>=2.1", "onnx>=1.15"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Javihaus/zeropoint"
Documentation = "https://javihaus.github.io/zeropoint/"
Benchmark = "https://github.com/Javihaus/zeropoint/blob/main/BENCHMARK.md"
Changelog = "https://github.com/Javihaus/zeropoint/blob/main/CHANGELOG.md"
Issues = "https://github.com/Javihaus/zeropoint/issues"

[tool.hatch.version]
path = "src/zeropoint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zeropoint"]

[tool.hatch.build.targets.sdist]
include = ["src/zeropoint", "tests", "README.md", "BENCHMARK.md", "CHANGELOG.md", "LANGUAGES.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
