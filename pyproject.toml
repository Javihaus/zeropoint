[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zeropoint"
dynamic = ["version"]
description = "An energy-based decision engine that chooses among options, or says that none of them fits."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Javier Marín", email = "javier@jmarin.info" }]
requires-python = ">=3.9"
keywords = ["energy-based model", "decision engine", "out-of-scope detection", "abstention", "classification", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.22",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
]

[project.optional-dependencies]
train = ["torch>=2.1"]
monitor = ["torch>=2.1", "ndtracker>=2.0"]
dev = ["pytest>=7", "torch>=2.1"]

[project.urls]
Homepage = "https://github.com/Javihaus/zeropoint"
Benchmark = "https://github.com/Javihaus/zeropoint/blob/main/BENCHMARK.md"
Issues = "https://github.com/Javihaus/zeropoint/issues"

[tool.hatch.version]
path = "src/zeropoint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zeropoint"]

[tool.hatch.build.targets.sdist]
include = ["src/zeropoint", "tests", "README.md", "BENCHMARK.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
